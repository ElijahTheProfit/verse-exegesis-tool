services:
  - type: web
    name: verse-exegesis-tool
    runtime: node
    plan: free
    # --include=dev ensures Vite & friends are installed even if NODE_ENV=production.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: OPENAI_API_KEY
        sync: false
